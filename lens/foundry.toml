# Standalone build config for QuoteLens.sol (lens/build.sh). Pinned solc +
# stripped metadata so QuoteLens.bin is byte-reproducible on any machine.
[profile.default]
src = "."
out = "out"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
