[package]
name = "sextant-observe"
version.workspace = true
edition.workspace = true
description = "Sextant's process hygiene: a panic hook that exits, and the log subscriber. Forked from CoW Protocol's observe crate through lp-terminal-rootfix."
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["full"] }
serde_json.workspace = true
