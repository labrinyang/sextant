[package]
name = "sextant-discovery"
description = "Sextant's pool discovery: the indexer client, the QuoteLens encoder and Ekubo pool reads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sextant-amm = { path = "../amm" }
sextant-chain = { path = "../chain" }
sextant-io = { path = "../io" }
sextant-route = { path = "../route" }
alloy = { version = "2.2.0", default-features = false, features = ["eips"] }
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
anyhow.workspace = true
futures-util = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.0", features = ["full"] }

[dev-dependencies]
axum = "0.8.9"
